<title>루미아 신용정보원 — 실험체 신용조회</title>
<meta name="description" content="이터널리턴 전적 기반 (유저 × 실험체) 신용평가. 이 사람의 이 실험체를 얼마나 신용할 수 있는가.">
<link rel="stylesheet" href="style.css?v=1">

<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <span class="seal">信</span>
      <div>
        <strong>루미아 신용정보원</strong>
        <small>LUMIA CREDIT BUREAU</small>
      </div>
    </div>

  </div>
</header>

<main class="wrap">
  <section class="search-card">
    <h1>실험체 신용조회</h1>
    <p class="lead">같은 사람이라도 <b>실험체마다 신용도는 다릅니다.</b> 조회 대상의 닉네임을 입력하십시오.</p>
    <form id="form" autocomplete="off">
      <input id="name" type="text" placeholder="닉네임" maxlength="24" required>
      <button type="submit">신용조회</button>

    <p class="notice">본 조회는 공개 전적을 근거로 산정되며, 조회 사실은 대상자의 조회 이력에 기록됩니다.</p>
  </section>

  <section id="status" class="status" hidden></section>
  <section id="table-view" hidden></section>
  <section id="report-view" hidden></section>
</main>

<footer class="wrap foot">
  <p>루미아 신용정보원은 실존하지 않는 기관이며, 본 평가는 오락 목적입니다.</p>
</footer>
