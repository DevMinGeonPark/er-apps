<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>루미아섬 사망진단서 발급</title>
<link rel="stylesheet" href="style.css?v=night-clerk-20260910">
<link rel="stylesheet" href="/shared/night-clerk.css?v=20260910">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚰️</text></svg>">
</head>
<body data-lumia-document="autopsy">

<header class="masthead">
  <div class="masthead-inner">
    <span class="org">루미아섬 보건의료원 <em>민원발급 시스템</em></span>
    <span class="q">— 누가 이 유저를 죽였는가</span>
  </div>
</header>

<section class="issue-panel" id="issuePanel">
  <h1 class="intake-title">사망진단서</h1>
  <p class="intake-deck">최근 전적에서 사망 기록을 찾아 검시합니다. 발급 후 다른 사망 기록을 선택할 수 있습니다.</p>
  <form id="issueForm" autocomplete="off" novalidate>
    <label for="nick">게임 닉네임 <span>필수</span></label>
    <input id="nick" type="text" placeholder="여기에 이름 적어." required aria-describedby="nickError hint">
    <p id="nickError" class="field-error" hidden></p>
    <button type="submit" id="issueBtn">사망진단서 발급 신청</button>
  </form>
  <p class="hint" id="hint" role="status">닉네임을 입력한 뒤 발급을 신청하세요.</p>
  <button type="button" id="cancelIssue" class="ghost" hidden>입력으로 돌아가기</button>
</section>

<section class="picker" id="picker" hidden>
  <div class="picker-title">발급 대상 사망 기록</div>
  <div class="picker-list" id="pickerList"></div>
</section>

<p class="result-summary" id="resultSummary" hidden></p>
<main id="certRoot" hidden></main>

<div class="actions" id="actions" hidden>
  <button id="pngBtn">PNG로 저장</button>
  <button id="printBtn" class="ghost">인쇄 / PDF</button>
</div>

<footer class="pagefoot">
  <p>전적·게임 정보: 이터널 리턴 공식 Open API · 최근 90일 이내 조회 기록 기준 · 닉네임 변경 이전 기록 제외</p>
  본 문서는 팬메이드 유머 콘텐츠이며 법적 효력이 없습니다. 고인의 명복을 빕니다.
</footer>

<script src="vendor/html2canvas.min.js"></script>

<script src="er-core.js?v=1"></script>

<script src="app.js?v=night-clerk-20260910"></script>
</body>
</html>
