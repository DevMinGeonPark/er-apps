<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>루미아섬 원수 관측소</title>
<link rel="stylesheet" href="style.css?v=night-clerk-20260910">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>">
<link rel="stylesheet" href="/shared/night-clerk.css?v=20260910">
</head>
<body data-lumia-document="tracking">

<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <span class="rec" aria-hidden="true"></span>
      <h1>원수 관측소</h1>
      <span class="sub">LUMIA ISLAND ENEMY OBSERVATORY</span>
    </div>
    <p class="tagline">그놈은 어떻게 됐을까 — 당신을 죽인 자의 그 후를 추적합니다</p>
  </div>
</header>

<main>
  <section class="console" id="searchConsole">
    <form id="meForm" autocomplete="off">
      <label for="meInput">내 닉네임</label>
      <input id="meInput" maxlength="100" aria-describedby="hint" type="text" placeholder="내 닉네임 — 최근 전적에서 원수를 색출합니다" required>
      <button type="submit" id="meBtn">원수 색출</button>
    </form>
    <button type="button" class="linklike" id="directToggle" aria-expanded="false" aria-controls="directForm">상대 이름을 알고 있어요</button>
    <form id="directForm" autocomplete="off" hidden>
      <label for="enemyInput">상대 닉네임</label>
      <input id="enemyInput" maxlength="100" required aria-describedby="hint" type="text" placeholder="원수 닉네임 — 근황만 관측합니다">
      <button type="submit">관측 개시</button>
    </form>
    <p class="hint" id="hint" role="status" aria-live="polite">본 시설은 팬메이드 유머 시설이며 실제 감시 기능이 없습니다.</p>
  </section>

  <section class="killers" id="killersSec" hidden>
    <div class="sec-head">
      <h2>원수 후보 명단</h2>
      <span class="sec-note" id="killersNote"></span>
    </div>
    <div class="killer-grid" id="killerGrid"></div>
  </section>

  <section class="observation" id="obsSec" hidden>
    <button type="button" class="linklike back" id="backBtn">← 원수 후보 명단으로</button>
    <div id="obsRoot"></div>
  </section>
<p class="source-note" style="font-size:12px;opacity:.7;text-align:center;padding:16px">전적·게임 정보: 이터널 리턴 공식 Open API · 최근 90일 이내 조회 기록 기준 · 닉네임 변경 이전 기록 제외</p>
</main>

<footer class="pagefoot">
  관련 문서 — <a href="/cert/">자격증</a> ·
  <a href="/death/">사망진단서</a> · 원수 관측소
</footer>

<script src="er-config.js?v=1"></script>
<script src="er-core.js?v=1"></script>
<script src="api.js?v=night-clerk-20260910"></script>
<script src="/shared/lumia-documents.js?v=20260910"></script>
<script src="/shared/night-clerk.js?v=20260910"></script>
<script src="app.js?v=night-clerk-20260910"></script>
</body>
</html>
