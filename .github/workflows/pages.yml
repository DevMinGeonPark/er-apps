name: Deploy static site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'hub/**'
      - 'shared/**'
      - 'er-cert/public/**'
      - 'er-death/public/**'
      - 'er-fault/public/**'
      - 'er-enemy/public/**'
      - 'er-credit/public/**'
      - 'er-map/dist.html'
      - 'build.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
