<script>
(()=>{const root=document.getElementById('ds'),q=s=>root.querySelector(s);const data={cert:{title:'실험체 자격증',desc:'닉네임과 운용 실험체를 선택하세요. 전 시즌 기록으로 자격을 검정합니다.',quote:'자격증?\n…어느 실험체로.',actions:['자격증 PNG 저장','링크 복사']},death:{title:'사망진단서',desc:'최근 사망 기록을 찾아 진단서로 발급합니다.',quote:'또 죽었어?\n…알았어.\n기록 줘 봐.',actions:['PNG 저장','인쇄 / PDF']},fault:{title:'과실비율 산정서',desc:'함께 플레이한 팀원의 닉네임을 입력하세요.',quote:'이번에도\n네 잘못은 아니라는 거지?\n…셋 다 볼게.',actions:['산정서 PNG 저장','판정 근거 보기']},enemy:{title:'원수 관측소',desc:'내 기록에서 상대를 찾거나, 알고 있는 닉네임으로 조회합니다.',quote:'아직도 그 사람\n찾고 있어?\n…이름 줘 봐.',actions:['관측 대상 바꾸기']},credit:{title:'루미아 신용정보원',desc:'실험체별 등급과 평가 근거를 조회합니다.',quote:'그 실험체,\n또 하려고?\n…기록부터 보고 결정해.',actions:['선택 평가서 저장','다른 닉네임 조회']},payroll:{title:'루미아 노동청',desc:'랭크 RP를 정산해 급여명세서로 발급합니다.',quote:'이만큼 했는데\n오히려 깎였다고?\n…명세서 뽑아줄게.',actions:['명세서 PNG 저장','공유하기']}};let current='payroll',stage='result';let nickname='',savedForms={};function capture(){const f=q('.ds-form');if(f){const fields=Object.fromEntries(new FormData(f).entries());if(fields.nickname)nickname=fields.nickname;savedForms[current]=fields;}}
function motion(){if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&q('#ds-content').animate)q('#ds-content').animate([{transform:'translateY(12px)',opacity:.4},{transform:'translateY(0)',opacity:1}],{duration:260,easing:'ease-out'});}
function make(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function applyNick(){root.querySelectorAll('#ds-content .ds-nickname').forEach(n=>n.textContent=nickname|| (current==='payroll'?'루미아직장인':'루미아생존자'));}
function render(){q('#ds-toast').textContent='';q('#ds-input-tab').setAttribute('aria-pressed',String(stage==='input'));q('#ds-result-tab').setAttribute('aria-pressed',String(stage==='result'));q('#ds-quote').textContent=data[current].quote;const out=q('#ds-content');out.replaceChildren();if(stage==='input'){out.append(make('h1',data[current].title),make('p',data[current].desc,'ds-deck'));const f=make('form',undefined,'ds-form'),field=make('div',undefined,'ds-field'),label=make('label','게임 닉네임'),input=make('input');input.name='nickname';input.id='ds-nickname-input';label.htmlFor=input.id;input.required=true;input.maxLength=30;input.value=nickname;input.placeholder='여기에 이름 적어.';field.append(label,input);f.append(field,q('#ds-form-'+current).content.cloneNode(true));f.querySelectorAll('.ds-field>label').forEach((l,i)=>{const control=l.parentElement.querySelector('input,select');if(control){control.id='ds-control-'+i;l.htmlFor=control.id;}});const submit=make('button','예시 발급하기 ↗','ds-primary');submit.type='submit';f.append(submit,make('p','기능 배치 확인용입니다. 실제 전적을 조회하지 않습니다.','ds-form-note'));out.append(f);const stored=savedForms[current]||{};Object.entries(stored).forEach(([key,val])=>{f.querySelectorAll('[name="'+key+'"]').forEach(el=>{if(el.type==='radio')el.checked=el.value===val;else if(key!=='nickname')el.value=val;});});function enemyMode(){if(current!=='enemy')return;const direct=f.querySelector('[name=method]:checked').value==='direct';f.querySelector('.ds-enemy-field').hidden=!direct;f.querySelector('[name=enemyName]').required=direct;input.required=!direct;}enemyMode();f.querySelectorAll('[name=method]').forEach(r=>r.addEventListener('change',enemyMode));f.addEventListener('submit',e=>{e.preventDefault();capture();stage='result';render();});}else{out.append(q('#ds-result-'+current).content.cloneNode(true));applyNick();if(current==='cert'){const values=savedForms.cert||{};out.querySelector('.ds-character-name').textContent=values.character||'재키';if(values.style==='standard'){const cert=out.querySelector('.ds-cert');cert.style.background='#dee2d7';cert.style.color='#293429';out.querySelector('.ds-cert-style').textContent='검정원 표준 · 운용 검정';cert.querySelectorAll('p,small,.ds-grade,.ds-grade span,.ds-cert-footer').forEach(n=>n.style.color='#46553e');}}if(current==='death'){out.querySelector('.ds-death-record').addEventListener('change',e=>{const old=e.target.value==='1';out.querySelector('.ds-death-location').textContent=old?'병원':'골목길';out.querySelector('.ds-death-rank').textContent=old?'5위':'8위';});}if(current==='credit'){const choices=[['재키','B+','742 / 1,000점','평가 가능한 표본 · 등급과 점수는 설계용 예시'],['아야','A','826 / 1,000점','평가 가능한 표본 · 등급과 점수는 설계용 예시'],['리오','보류','Thin File','표본이 부족해 평가할 수 없습니다. 낮은 등급을 의미하지 않습니다.']];out.querySelectorAll('[data-credit]').forEach(row=>row.querySelector('button').addEventListener('click',()=>{out.querySelectorAll('[data-credit]').forEach(r=>r.dataset.active=String(r===row));const d=choices[Number(row.dataset.credit)];out.querySelector('.ds-credit-name').textContent=d[0];out.querySelector('.ds-credit-grade').textContent=d[1];out.querySelector('.ds-credit-points').textContent=d[2];out.querySelector('.ds-credit-note').textContent=d[3];}));}const actions=make('div',undefined,'ds-actions');data[current].actions.forEach(label=>{const b=make('button',label);b.type='button';b.addEventListener('click',()=>{if(label.includes('바꾸기')||label.includes('다른 닉네임')){stage='input';render();return;}if(label.includes('근거')){const details=[...out.querySelectorAll('details')].find(d=>d.querySelector('summary').textContent.includes('판정 근거'));if(details){details.open=true;return;}}q('#ds-toast').textContent='이 시안에서는 '+label+' 버튼의 위치만 확인할 수 있습니다. 실제 파일 저장·공유는 기존 기능을 연결합니다.';});actions.append(b);});out.append(actions);}motion();}
q('#ds-document').addEventListener('change',e=>{capture();current=e.target.value;render();});q('#ds-input-tab').addEventListener('click',()=>{stage='input';render();});q('#ds-result-tab').addEventListener('click',()=>{capture();stage='result';render();});render();
})();
</script>
