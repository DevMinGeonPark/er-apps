<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>루미아 문서국 — 야간 접수</title>
  <meta name="description" content="이터널 리턴의 기록으로 자격증·사망진단서·과실비율·신용평가·급여명세서를 발급하는 비공식 문서국.">
  <meta name="theme-color" content="#0c161c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🗂️%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/lobby.css">
  <link rel="preload" as="image" href="/assets/lumia-art.jpg">
  <script defer src="/shared/lumia-documents.js"></script>
  <script defer src="/lobby.js"></script>
</head>
<body>
<div id="lam" data-view="home" aria-label="루미아 문서국 야간 접수">
  <img class="am-art" src="/assets/lumia-art.jpg" alt="서류를 든 은발 기록관이 야간 연구실에서 기다리고 있다" fetchpriority="high">
  <div class="am-veil" aria-hidden="true"></div>
  <header class="am-top">
    <div class="am-logo">루미아 문서국<small>LUMIA ARCHIVES</small></div>
    <span class="am-night">야간 접수</span>
  </header>
  <main class="am-main">
    <section class="am-character" aria-label="기록관">
      <div class="am-dialogue">
        <div class="am-speaker">기록관</div>
        <p class="am-quote" id="am-quote" aria-hidden="true">하… 또 왔네.
이번엔 무슨 서류인데?</p>
        <span class="am-sr" id="am-dialogue-live" role="status" aria-atomic="true">하… 또 왔네. 이번엔 무슨 서류인데?</span>
        <p class="am-aside" id="am-aside">필요한 것만 골라. 오래 걸리니까.</p>
      </div>
    </section>
    <section class="am-panel" aria-label="문서 접수대">
      <div id="am-home" class="am-section">
        <div class="am-home-head"><h1 class="am-heading" id="am-home-title" tabindex="-1">무슨 일로 왔어?</h1><p>필요한 서류를 골라주세요.</p></div>
        <div class="am-subhead"><span id="am-recent-label">바로 찾기</span><span id="am-total"></span></div>
        <div class="am-recent" id="am-recent"></div>
        <button type="button" class="am-more" id="am-open" aria-expanded="false" aria-controls="am-catalog"><span>다른 서류 찾기</span><span aria-hidden="true">↗</span></button>
        <p class="am-home-note" id="am-home-note">문서를 선택하면 이곳에 최근 목록이 남습니다.</p>
      </div>
      <div id="am-catalog" class="am-section" hidden>
        <div class="am-catalog-heading"><h2 class="am-heading" id="am-catalog-title" tabindex="-1">전체 서류</h2><button class="am-back" type="button" id="am-catalog-back">접수대로 돌아가기 ↗</button></div>
        <div class="am-search"><label for="am-query">문서 검색</label><input id="am-query" type="search" placeholder="이름이나 내용으로 찾기" autocomplete="off" aria-controls="am-results"><button type="button" class="am-clear" id="am-clear" hidden>지우기</button></div>
        <div class="am-filters" id="am-filters" role="group" aria-label="문서 분류"></div>
        <div class="am-results" id="am-results"></div>
        <p class="am-empty" id="am-empty" hidden>찾는 서류가 없습니다.<br>다른 검색어나 분류를 선택해주세요.</p>
        <div class="am-pagebar"><span id="am-result-count" role="status" aria-atomic="true"></span><div class="am-page-buttons" id="am-page-buttons"><button type="button" id="am-prev" aria-label="이전 문서 페이지">← 이전</button><span id="am-page-number"></span><button type="button" id="am-next" aria-label="다음 문서 페이지">다음 →</button></div></div>
      </div>
      <div id="am-detail" class="am-section" hidden>
        <button type="button" class="am-back" id="am-detail-back">← 다른 서류 고르기</button>
        <p class="am-kind" id="am-kind"></p>
        <h2 class="am-heading" id="am-document-title" tabindex="-1"></h2>
        <p class="am-description" id="am-description"></p>
        <dl class="am-meta-list"><div><dt>분석 대상</dt><dd id="am-target"></dd></div></dl>
        <form class="am-form" id="am-form" novalidate>
          <label for="am-nickname">게임 닉네임 <span class="am-muted">(선택)</span></label>
          <input id="am-nickname" name="nickname" placeholder="여기에 이름 적어." maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="am-form-hint am-error">
          <p class="am-error" id="am-error" role="alert" hidden></p>
          <button type="submit" class="am-primary" id="am-submit"><span id="am-submit-label">접수대 열기</span><span aria-hidden="true">↗</span></button>
          <p class="am-hint" id="am-form-hint"></p>
          <p class="am-hint">이름은 이 브라우저에 기억합니다. 조회는 각 접수대에서 신청합니다.</p>
        </form>
      </div>
    </section>
  </main>
  <noscript><nav class="am-noscript" aria-label="문서 바로가기">문서 접수대를 선택해주세요.<br><a href="/cert/">실험체 자격증</a><a href="/death/">사망진단서</a><a href="/fault/">과실비율 산정서</a><a href="/enemy/">원수 관측소</a><a href="/credit/">루미아 신용정보원</a><a href="/payroll/">루미아 노동청</a></nav></noscript>
  <footer class="am-footer"><span>비공식 팬 제작물 · 모든 문서는 재미로 발급되며 실제 효력이 없습니다.</span></footer>
</div>
</body>
</html>
